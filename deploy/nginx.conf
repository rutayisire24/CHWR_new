# Reverse proxy for the National CHW Registry.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/chwr
#   sudo ln -s /etc/nginx/sites-available/chwr /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d chwr.example.org      # fills in the TLS lines
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace chwr.example.org throughout.

server {
    listen 80;
    listen [::]:80;
    server_name chwr.example.org;

    # ENV=prod marks the cookies Secure, so plain HTTP cannot sign in anyway.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chwr.example.org;

    ssl_certificate     /etc/letsencrypt/live/chwr.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chwr.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The register is a national one and the browser should not be talked out
    # of HTTPS once it has been here. The application sets the rest of the
    # security headers itself, including the CSP; do not duplicate them here,
    # or the two will drift.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # A CHW import may be several megabytes. auth.MaxMultipartBytes caps the
    # body at 12 MB and the importer refuses a file over 10 MB by name; this
    # has to be at least as large, or nginx refuses first with a bare 413.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The application reads this, but only from an address named in
        # TRUSTED_PROXY. $proxy_add_x_forwarded_for appends the peer nginx
        # actually saw, so a header the client invented stays to its left and
        # is never reached.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Committing a ten-thousand-row import takes about thirty seconds, and
        # nginx's default 60s read timeout would cut it off mid-write.
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_request_buffering on;
    }
}
